name: SportsDataIO Diagnostic Capture (TEMPORARY)

# TEMPORARY workflow (Mac, 2026-08-11/12) -- triggers the throwaway
# capture endpoint in apps/sports-intel-layer/app/diagnostics/. Deleted
# alongside that endpoint (and this whole branch) once validation is
# complete. See PROGRESS.md for the full approved plan.
#
# Deliberately push-triggered, scoped to this exact temporary branch name
# only -- NOT workflow_dispatch. workflow_dispatch requires a workflow to
# exist on the repo's default branch (main) to become dispatchable via the
# API (a real constraint this project already hit once before, see
# PROGRESS.md's phase2-e2e.yml note); promoting a throwaway diagnostic to
# main just to satisfy that would also trigger a real deploy-staging run
# (ci-cd.yml fires on every push to main). This push-trigger approach
# avoids both: it fires from the exact commit being pushed, no default-
# branch registration needed, and `sportsdataio-diagnostic-run` isn't
# `dev`/`main`/a tag, so ci-cd.yml's own triggers (push/PR to dev or main,
# `v*` tags) never match it -- confirmed by inspection before this file
# was written, not assumed.

on:
  push:
    branches: [sportsdataio-diagnostic-run]

jobs:
  capture:
    runs-on: ubuntu-latest
    # Required for GitHub to inject the dev-Environment-scoped secret
    # (SPORTSDATAIO_DIAGNOSTIC_TOKEN) below -- repo-level secrets don't
    # need this, Environment secrets do. This job only ever reads that
    # token -- SPORTSDATAIO_API_KEY itself is never referenced here or
    # anywhere in GitHub; it stays in Railway dev only.
    environment: dev
    steps:
      - name: Preflight -- confirm routing/auth without a token (expect 401, not 404)
        # Deliberately omits X-Diagnostic-Token. The endpoint checks token
        # validity *before* the one-shot guard and before touching
        # SportsDataIO, so this proves the diagnostics router is live on
        # the freshly-deployed build at zero cost: no budget consumed, no
        # one-shot guard burned. A non-401 result (e.g. still 404) means
        # the fresh deploy did not fix routing -- fail here rather than
        # spend any of the 12-call budget against a broken endpoint.
        run: |
          url="https://sports-intel-layer-dev.up.railway.app/diagnostics/sportsdataio-capture"
          http_status=$(curl -sS "$url" -o /dev/null -w "%{http_code}")
          echo "preflight (no token) HTTP status: ${http_status}"
          if [ "$http_status" != "401" ]; then
            echo "Expected 401 (invalid diagnostic token), got ${http_status} -- stopping before the real capture."
            exit 1
          fi

      - name: Call diagnostic endpoint (injuries only -- step 2 of the approved staged sequence), save full response to a file (not the log)
        env:
          DIAGNOSTIC_TOKEN: ${{ secrets.SPORTSDATAIO_DIAGNOSTIC_TOKEN }}
        run: |
          url="https://sports-intel-layer-dev.up.railway.app/diagnostics/sportsdataio-capture?categories=injuries"
          http_status=$(curl -sS \
            -H "X-Diagnostic-Token: ${DIAGNOSTIC_TOKEN}" \
            "$url" \
            -o capture_result.json \
            -w "%{http_code}")
          echo "top-level HTTP status: ${http_status}"

      - name: Print metadata summary only -- never the raw_response bodies
        run: |
          python3 -c "
          import json
          with open('capture_result.json') as f:
              data = json.load(f)
          print('total_requests_made:', data.get('total_requests_made'))
          print('budget_ceiling:', data.get('budget_ceiling'))
          for name, result in data.get('results', {}).items():
              summary = {k: v for k, v in result.items() if k != 'raw_response'}
              print(f'{name} -> {summary}')
          "

      - name: Upload full captured response as an artifact (not printed to logs)
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-capture-result
          path: capture_result.json
          retention-days: 1
