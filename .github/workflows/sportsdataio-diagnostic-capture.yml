name: SportsDataIO Diagnostic Capture (TEMPORARY)

# TEMPORARY workflow (Mac, 2026-08-14) -- triggers the throwaway
# single-endpoint capture route in apps/sports-intel-layer/app/diagnostics/.
# Deleted alongside that endpoint once verification is complete.

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    # Required for GitHub to inject the dev-Environment-scoped secret
    # (SPORTSDATAIO_DIAGNOSTIC_TOKEN) below -- repo-level secrets don't
    # need this, Environment secrets do.
    environment: dev
    steps:
      - name: Call diagnostic endpoint, save full response to a file (not the log)
        env:
          DIAGNOSTIC_TOKEN: ${{ secrets.SPORTSDATAIO_DIAGNOSTIC_TOKEN }}
        run: |
          url="https://sports-intel-layer-dev.up.railway.app/diagnostics/sportsdataio-capture"
          http_status=$(curl -sS \
            -H "X-Diagnostic-Token: ${DIAGNOSTIC_TOKEN}" \
            "$url" \
            -o capture_result.json \
            -w "%{http_code}")
          echo "top-level HTTP status: ${http_status}"

      - name: Print metadata summary only -- never the raw_response body
        run: |
          python3 -c "
          import json
          with open('capture_result.json') as f:
              data = json.load(f)
          summary = {k: v for k, v in data.items() if k != 'raw_response'}
          print(json.dumps(summary, indent=2))
          "

      - name: Upload full captured response as an artifact (not printed to logs)
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-teams-capture-result
          path: capture_result.json
          retention-days: 1
